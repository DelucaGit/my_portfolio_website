name: Check and build

# Only a check: it runs the link check and builds the site to see that both
# still work. Nothing from this run reaches the published site. Hostinger
# builds and publishes the site itself from the repository, and the link
# check's result file (site-check.json) is not in git, so Hostinger's build
# never sees it.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22.18 or newer: scripts/check-sites.mjs imports the TypeScript data file
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Prints what it finds about every customer site and writes
      # site-check.json, which the build below reads. A site counts as ended
      # only when its domain is gone or it answers 404/410. The check can
      # never fail the run.
      - name: Check the customers' sites
        run: npm run check:sites
        continue-on-error: true
        timeout-minutes: 5

      - name: Build static site
        run: npm run build
