name: Deploy to Hostinger

# Every run checks the customers' sites, builds and deploys:
# on a push to main, by hand, and once a month so the site buttons stay
# right even when nothing is published.
on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # 05:17 UTC on the 1st of every month
    - cron: "17 5 1 * *"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 22.18 or newer: scripts/check-sites.mjs imports the TypeScript data file
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Writes site-check.json, which the build reads. A site counts as ended
      # only when its domain is gone or it answers 404/410. The check can
      # never stop the deploy: without a result every site button stays.
      - name: Check the customers' sites
        run: npm run check:sites
        continue-on-error: true
        timeout-minutes: 5

      - name: Build static site
        run: npm run build

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          # FTP account is already rooted in the site public_html — upload to ./
          server-dir: ./
          dangerous-clean-slate: true
