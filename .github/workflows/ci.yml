name: Pull request checks

# Lint, type check the scripts, build and the Playwright suite on every pull request.
on:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The .mjs scripts are not part of the Next build's type check, so
      # check them on their own against the shared formats in src/lib.
      - name: Type check scripts
        run: npm run typecheck:scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # Builds the static site with Webpack, then runs Playwright against it.
      - name: Build and test
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
